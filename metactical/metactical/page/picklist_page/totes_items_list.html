	<div class="col-md-12" style="background-color: #FFF; border-radius: 10px; margin-bottom: 20px; box-shadow: 0px 0px 4px #CAC7C7;">
		{% if pl_texts %}
			{% for pl in pl_texts %}
			<div style="width: 100%; float: left; padding-top: 10px; border-bottom: 1px solid #F8F8F8;">
				<div style="width: 25%; float: left; padding: 10px;">
					<h5>{{ pl.pick_list }} ({{pl.tote}})</h5>
				</div>
				<div id="pl-text-container-{{ pl.pick_list }}" style="background-color: #fff; padding: 10px; width: 63%; float: left;">
					{{ pl.pl_text }}
				</div>
				<div style="width: 10%; text-align: right; float: right;">
					<b><a class="list-top-nav-desk alt-color edit-pl-text" href="#"
							data-pick-list="{{ pl.pick_list }}">Add/Edit Note</a>
					</b>
				</div>
			</div>
			{% endfor %}
		{% endif %}
	</div>
	<div class="col-lg-6 col-md-12 col-sm-12 col-xs-12" id="pick-list-items-div">
		<h4 class="items-header"><center>Items to Pick</center></h4>
		<div class="item-barcode"></div>
		<ul class="list-top-nav col-md-12">
			<li><b><a href="#" class="alt-color back-to-list">Back</a></b></li>
			<li><center><b>Items to Pick</b></center></li>
			<li style="text-align: right;"><a class="alt-color" href="#" id="picked-items-btn"><b>Picked Items</b></a></li>
		</ul>
		<ul class="item-ul to-pick-ul"></ul>
	</div>
	<div class="col-lg-6 col-md-12 col-sm-12 col-xs-12" id="picked-items-div">
		<h4 class="items-header"><center>Picked Items</center></h4>
		<ul class="list-top-nav col-md-12">
			<li><b><a class="alt-color back-to-pick" href="#" id="back-to-pick">Back</a></b></li>
			<li><center><b>Picked Items</b></center></li>
			<li style="text-align: right;"><a class="alt-color submit-items-btn" href="#"><b>Submit</b></a></li>
		</ul>
		<ul class="item-ul picked-ul"></ul>
	</div>
</div>
